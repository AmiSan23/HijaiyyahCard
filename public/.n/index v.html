<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkmate 101 - Static</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Panel Informasi Atas -->
  <irow class="top-panel">
    <icol class="panel-col">
      <div>Room: <span id="roomCode">####</span></div>
      <div>Player:</div>
      <ul id="playerStats">
        <li>Aaa | W: 1 L: 2</li>
        <li>Bbb | W: 0 L: 1</li>
        <li>Ccc | W: 2 L: 2</li>
        <li>Ddd | W: 0 L: 2</li>
      </ul>
    </icol>
    <icol class="panel-col border-left">
      <div>Round: <span id="roundNum">11</span></div>
      <div class="mt-10">Last Game:</div>
      <div>Win: Aaa<br>Lose: Ccc</div>
    </icol>
    <icol class="panel-col border-left">
      <div>Kartu terbuang: <span id="discardCount">12</span></div>
      <div>Sisa kartu: <span id="deckCount">88</span></div>
      <div class="mt-10">Giliran saat ini:</div>
      <div>
        <ul style="padding-left: 20px; margin: 0;">
          <li><span id="currentTurnName">Aaa</span></li>
        </ul>
      </div>
    </icol>

    <icol class="empty">
      <button class="hidden btn-primary" id="btnMainLagi">Main Lagi</button>
      <button class="hidden btn-danger" id="btnKeluar">Keluar</button>
    </icol>
  </irow>

  <icol class="floor" id="floor">

    <irow class="row3">
      <icol class="empty"></icol>

      <icol class="seat seat-C">
        <div class="seat-name" id="nameC">Ccc</div>
        <div class="fanning-container opponent-cards" id="handCcc">
          <img src="img/back.png" class="card-img" alt="Kartu Lawan">
          <img src="img/back.png" class="card-img" alt="Kartu Lawan">
          <img src="img/back.png" class="card-img" alt="Kartu Lawan">
          <img src="img/back.png" class="card-img" alt="Kartu Lawan">
        </div>
      </icol>
      
      <icol class="empty"></icol>
    </irow>
    
    <irow class="row3">
      <icol class="seat seat-D">
        <div class="fanning-container opponent-cards" id="handDdd">
          <img src="img/back.png" class="card-img" alt="Kartu Lawan">
          <img src="img/back.png" class="card-img" alt="Kartu Lawan">
          <img src="img/back.png" class="card-img" alt="Kartu Lawan">
          <img src="img/back.png" class="card-img" alt="Kartu Lawan">
        </div>
        <div class="seat-name" id="nameD">Ddd</div>
      </icol>
      
      <icol class="table">
        <irow class="row3">
          <div class="pile pile-discard-C">
            <div class="discard-grid" id="discardGrid">
              <img src="img/Ft_Kho.png" class="card-img" alt="Kartu Terbuang">
            </div>
            <button class="action-btn btn-ambil" id="btnAmbilDiscard">Ambil</button>
          </div>
          
          <irow class="openCardArea" id="openAreaC">
            <img src="img/" class="card-img hidden">
            <img src="img/" class="card-img hidden">
            <img src="img/" class="card-img hidden">
            <img src="img/" class="card-img hidden">
          </irow>
          
          <div class="pile pile-discard-B">
            <div class="discard-grid" id="discardGrid">
              <img src="img/Ks_Kho.png" class="card-img" alt="Kartu Terbuang">
            </div>
            <button class="action-btn btn-ambil" id="btnAmbilDiscard">Ambil</button>
          </div>
        </irow>
        
        <irow class="row3">
          <irow class="openCardArea" id="openAreaD">
            <img src="img/" class="card-img hidden">
            <img src="img/" class="card-img hidden">
            <img src="img/" class="card-img hidden">
            <img src="img/" class="card-img hidden">
          </irow>
          
          <icol class="pile pile-deck" id="deckPile">
            <img src="img/back.png" class="card-img" alt="Deck">
            <div class="card-overlay-text">Sisa<br><span id="deckSisa">88</span></div>
            <button class="action-btn btn-ambil" id="btnAmbilDeck">Ambil</button>
          </icol>
          <!-- End Game Overlay (Muncul saat selesai[cite: 4]) -->
          <icol class="end-game-center hidden" id="endGameCenter">
            <div class="win-text">WIN<br><span id="winnerName">Aaa</span></div>
          </icol>
          
          <irow class="openCardArea" id="openAreaB">
            <img src="img/" class="card-img hidden">
            <img src="img/" class="card-img hidden">
            <img src="img/" class="card-img hidden">
            <img src="img/" class="card-img hidden">
          </irow>
        </irow>
        
        <irow class="row3">
          <div class="pile pile-discard-D">
            <div class="discard-grid" id="discardGrid">
              <img src="img/Ks_Ghain.png" class="card-img" alt="Kartu Terbuang">
            </div>
            <button class="action-btn btn-ambil" id="btnAmbilDiscard">Ambil</button>
          </div>
          
          <irow class="openCardArea" id="openAreaA">
            <img src="img/" class="card-img hidden">
            <img src="img/" class="card-img hidden">
            <img src="img/" class="card-img hidden">
            <img src="img/" class="card-img hidden">
          </irow>
          
          <div class="pile pile-discard-A">
            <irow class="discard-grid" id="discardGrid">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
              <img src="img/Sk_Qof.png" class="card-img" alt="Kartu Terbuang">
            </irow>
            <button class="action-btn btn-ambil" id="btnAmbilDiscard">Ambil</button>
          </div>
        </irow>
      </icol>
      
      <icol class="seat seat-B">
        <div class="fanning-container opponent-cards" id="handBbb">
          <img src="img/back.png" class="card-img" alt="Kartu Lawan">
          <img src="img/back.png" class="card-img" alt="Kartu Lawan">
          <img src="img/back.png" class="card-img" alt="Kartu Lawan">
          <img src="img/back.png" class="card-img" alt="Kartu Lawan">
        </div>
        <div class="seat-name" id="nameB">Bbb</div>
      </icol>
    </irow>
    
    <irow class="row3">
      <icol class="empty"></icol>

      <icol class="seat seat-A">
        <div class="fanning-container my-cards" id="myHand">
          <img src="img/Dm_As.png" class="card-img">
          <img src="img/Dm_Kho.png" class="card-img">
          <img src="img/Dm_25.png" class="card-img">
          <img src="img/Dm_Qof.png" class="card-img">
        </div>
        <div class="seat-name active-turn" id="nameA">Aaa</div>
      </icol>

      <icol class="score-panel">
        <div class="score-title">Kartumu:</div>
        <div class="score-detail" id="scoreCards">U' | Khu | Huu | Kh</div>
        <div class="score-calc" id="scoreCalc">26 + 25 + 25 - 25</div>
        <div class="score-title mt-10">Poinmu saat ini:</div>
        <div class="score-total" id="scoreTotal">50</div>
      </icol>
    </irow>
  </icol>
  
  <script type="module" src="client.js"></script>
</body>


</html>
