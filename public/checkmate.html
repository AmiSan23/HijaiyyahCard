<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkmate 101 - Live</title>
  <link rel="stylesheet" href="checkmate.css">
</head>

<body>
  <!-- Panel Informasi Atas -->
  <irow class="top-panel">
    <icol class="panel-col">
      <div>Room: <span id="roomCode">####</span></div>
      <div>Player:</div>
      <ul id="playerStats">
        <!-- Diisi dinamis oleh client.js -->
      </ul>
    </icol>
    <icol class="panel-col border-left">
      <div>Round: <span id="roundNum">1</span></div>
      <div class="mt-10">Last Game:</div>
      <div id="lastGameInfo">-</div>
    </icol>
    <icol class="panel-col border-left">
      <div>Kartu terbuang: <span id="discardCount">0</span></div>
      <div>Sisa kartu: <span id="deckCount">0</span></div>
      <div class="mt-10">Giliran saat ini:</div>
      <div>
        <ul style="padding-left: 20px; margin: 0;">
          <li><span id="currentTurnName">-</span></li>
        </ul>
      </div>
    </icol>

    <icol>
      <button class="hidden btn-primary" id="btnMainLagi">Main Lagi</button>
      <button class="hidden btn-danger" id="btnKeluar">Keluar</button>
    </icol>
  </irow>

  <!-- Area Permainan (Meja) -->
  <grid class="floor" id="floor">

    <!-- Kolom Kiri -->
    <grid>
      <div class="empty"></div>

      <icol class="seat seat-D">
        <div class="fanning-container opponent-cards" id="handDdd">
          <!-- Kartu belakang lawan D disuntik di sini -->
        </div>
        <div class="seat-name" id="nameD">Pemain Kiri</div>
      </icol>
      
      <div class="empty"></div>
    </grid>
    
    <!-- Kolom Tengah -->
    <grid>
      <icol class="seat seat-C">
        <div class="seat-name" id="nameC">Pemain Atas</div>
        <div class="fanning-container opponent-cards" id="handCcc">
          <!-- Kartu belakang lawan C disuntik di sini -->
        </div>
      </icol>
      
      <!-- Meja Tengah -->
      <grid class="table">
        <grid class="row3">
          <icol class="pile pile-discard-C">
            <irow class="discard-grid">
              <!-- Kartu buangan C disuntik di sini -->
            </irow>
            <button class="action-btn btn-ambil">Ambil</button>
          </icol>

          <irow class="openCardArea" id="openAreaD">
            <!-- Kartu Showdown D disuntik di sini -->
          </irow>
          
          <icol class="pile pile-discard-B">
            <irow class="discard-grid">
              <!-- Kartu buangan B disuntik di sini -->
            </irow>
            <button class="action-btn btn-ambil">Ambil</button>
          </icol>
        </grid>
        
        <grid class="row3">
          <irow class="openCardArea" id="openAreaC">
            <!-- Kartu Showdown C disuntik di sini -->
          </irow>
          
          <icol class="pile pile-deck" id="deckPile">
            <img src="img/back.png" class="card-img" alt="Deck" id="drawPileImg">
            <div class="card-overlay-text">Sisa<br><span id="deckSisa">0</span></div>
            <button class="action-btn btn-ambil" id="btnAmbilDeck">Ambil</button>
          </icol>

          <!-- End Game Overlay (Muncu saat selesai) -->
          <icol class="end-game-center hidden" id="endGameCenter">
            <div class="win-text">WIN<br><span id="winnerName">-</span></div>
          </icol>
          
          <irow class="openCardArea" id="openAreaA">
            <!-- Kartu Showdown A disuntik di sini -->
          </irow>
        </grid>
        
        <grid class="row3">
          <icol class="pile pile-discard-D">
            <irow class="discard-grid">
              <!-- Kartu buangan D disuntik di sini -->
            </irow>
            <button class="action-btn btn-ambil">Ambil</button>
          </icol>
          
          <irow class="openCardArea" id="openAreaB">
             <!-- Kartu Showdown B disuntik di sini -->
          </irow>
          
          <icol class="pile pile-discard-A">
            <irow class="discard-grid">
              <!-- Kartu buangan A disuntik di sini -->
            </irow>
            <button class="action-btn btn-ambil">Ambil</button>
          </icol>
        </grid>
      </grid>
      
      <icol class="seat seat-A">
        <div class="fanning-container my-cards" id="myHand">
          <!-- Kartu asli kamu disuntik di sini -->
        </div>
        <div class="seat-name active-turn" id="nameA">Kamu</div>
      </icol>
      
    </grid>
    
    <!-- Kolom Kanan -->
    <grid>
      <div class="empty"></div>

      <icol class="seat seat-B">
        <div class="fanning-container opponent-cards" id="handBbb">
          <!-- Kartu belakang lawan B disuntik di sini -->
        </div>
        <div class="seat-name" id="nameB">Pemain Kanan</div>
      </icol>

      <icol class="score-panel">
        <div class="score-title">Kartumu:</div>
        <div class="score-detail" id="scoreCards">-</div>
        <div class="score-calc" id="scoreCalc">-</div>
        <div class="score-title mt-10">Poinmu saat ini:</div>
        <div class="score-total" id="scoreTotal">0</div>
      </icol>
    </grid>
  </grid>
  
  <!-- Wajib menggunakan type="module" agar bisa import cards.js -->
  <script type="module" src="client.js"></script>
</body>
</html>
