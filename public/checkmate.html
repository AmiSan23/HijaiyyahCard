<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkmate 101 - Kartu Hijaiyyah</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Panel Informasi Atas -->
  <irow class="top-panel">
    <icol class="panel-col">
      <div>Room: <span id="roomCode">####</span></div>
      <div>Pemain:</div>
      <ul id="playerStats"></ul>
    </icol>
    <icol class="panel-col border-left">
      <div>Round: <span id="roundNum">1</span></div>
      <div class="mt-10">Last Game:</div>
      <div id="lastGameInfo">-</div>
    </icol>
    <icol class="panel-col border-left">
      <div>Kartu terbuang: <span id="discardCount">0</span></div>
      <div>Sisa kartu: <span id="deckCount">0</span></div>
      <div class="mt-10">Giliran saat ini:</div>
      <div>
        <ul style="padding-left: 20px; margin: 0;">
          <li><span id="currentTurnName">-</span></li>
        </ul>
      </div>
    </icol>

    <icol>
      <button class="hidden btn-primary" id="btnMainLagi">Main Lagi</button>
      <button class="hidden btn-danger" id="btnKeluar">Keluar</button>
    </icol>
  </irow>

  <!-- Area Permainan (Meja) -->
  <grid class="floor" id="floor">

    <!-- Kolom Kiri -->
    <grid>
      <div class="empty"></div>

      <icol class="seat seat-D">
        <div class="fanning-container opponent-cards" id="handDdd"></div>
        <div class="seat-name" id="nameD">-</div>
        <div class="discard-wrapper" id="discardWrapperD">
          <irow class="discard-grid" id="discardGridD"></irow>
          <button class="action-btn btn-ambil" id="btnAmbilDiscardD">Ambil</button>
        </div>
      </icol>

      <div class="empty"></div>
    </grid>

    <!-- Kolom Tengah -->
    <grid>
      <icol class="seat seat-C">
        <div class="seat-name" id="nameC">-</div>
        <div class="fanning-container opponent-cards" id="handCcc"></div>
        <div class="discard-wrapper" id="discardWrapperC">
          <irow class="discard-grid" id="discardGridC"></irow>
          <button class="action-btn btn-ambil" id="btnAmbilDiscardC">Ambil</button>
        </div>
      </icol>

      <!-- Meja Tengah -->
      <grid class="table">
        <grid class="row3">
          <!-- Baris 1: discard pile C (kiri) | openAreaD | discard pile B (kanan) -->
          <div class="discard-wrapper" id="discardWrapperC2">
            <irow class="discard-grid" id="discardGridC2"></irow>
            <button class="action-btn btn-ambil" id="btnAmbilDiscardC2">Ambil</button>
          </div>

          <irow class="openCardArea" id="openAreaD"></irow>

          <div class="discard-wrapper" id="discardWrapperB2">
            <irow class="discard-grid" id="discardGridB2"></irow>
            <button class="action-btn btn-ambil" id="btnAmbilDiscardB2">Ambil</button>
          </div>
        </grid>

        <grid class="row3">
          <!-- Baris 2: openAreaC | deck | end game overlay | openAreaA -->
          <irow class="openCardArea" id="openAreaC"></irow>

          <icol class="pile pile-deck" id="deckPile">
            <img src="img/back.png" class="card-img" alt="Deck" id="drawPileImg">
            <div class="card-overlay-text">Sisa<br><span id="deckSisa">0</span></div>
            <button class="action-btn btn-ambil" id="btnAmbilDeck">Ambil</button>
          </icol>

          <!-- End Game Overlay (Muncu saat selesai) -->
          <icol class="end-game-center hidden" id="endGameCenter">
            <div class="win-text">WIN<br><span id="winnerName">-</span></div>
            <div id="endScores"></div>
          </icol>

          <irow class="openCardArea" id="openAreaA"></irow>
        </grid>

        <grid class="row3">
          <!-- Baris 3: discard pile D (kiri) | openAreaB | discard pile A (kanan) -->
          <div class="discard-wrapper" id="discardWrapperD2">
            <irow class="discard-grid" id="discardGridD2"></irow>
            <button class="action-btn btn-ambil" id="btnAmbilDiscardD2">Ambil</button>
          </div>

          <irow class="openCardArea" id="openAreaB"></irow>

          <div class="discard-wrapper" id="discardWrapperA">
            <irow class="discard-grid" id="discardGridA"></irow>
            <button class="action-btn btn-ambil" id="btnAmbilDiscardA">Ambil</button>
          </div>
        </grid>
      </grid>

      <icol class="seat seat-A">
        <div class="fanning-container my-cards" id="myHand"></div>
        <div class="seat-name active-turn" id="nameA">Kamu</div>
      </icol>
    </grid>

    <!-- Kolom Kanan -->
    <grid>
      <div class="empty"></div>

      <icol class="seat seat-B">
        <div class="fanning-container opponent-cards" id="handBbb"></div>
        <div class="seat-name" id="nameB">-</div>
        <div class="discard-wrapper" id="discardWrapperB">
          <irow class="discard-grid" id="discardGridB"></irow>
          <button class="action-btn btn-ambil" id="btnAmbilDiscardB">Ambil</button>
        </div>
      </icol>

      <icol class="score-panel">
        <div class="score-title">Kartumu:</div>
        <div class="score-detail" id="scoreCards">-</div>
        <div class="score-calc" id="scoreCalc">-</div>
        <div class="score-title mt-10">Poinmu saat ini:</div>
        <div class="score-total" id="scoreTotal">0</div>
      </icol>
    </grid>
  </grid>

  <!-- Firebase + Game Logic -->
  <script type="module" src="client.js"></script>
</body>

</html>
