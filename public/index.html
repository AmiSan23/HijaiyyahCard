<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobby - Kartu Hijaiyyah</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="lobby-body">
  
  <div class="lobby-card">
    <h1 class="brand-title">Kartu Hijaiyyah</h1>
    <p class="brand-subtitle">Checkmate 101 Multiplayer & Bot</p>

    <!-- Pilihan Mode Game -->
    <div class="input-group">
      <label for="gameMode">Mode Permainan</label>
      <select id="gameMode" class="input-element">
        <option value="checkmate">Checkmate 101</option>
      </select>
    </div>

    <!-- Pilihan Lawan (Bot vs Online) -->
    <div class="input-group">
      <label for="lawanMode">Lawan Main</label>
      <select id="lawanMode" class="input-element">
        <option value="online">Multiplayer Online</option>
        <option value="bot">Lawan 3 Bot (Offline / Test)</option>
      </select>
    </div>

    <!-- Input Nama -->
    <div class="input-group">
      <label for="inputNama">Nama Kamu</label>
      <input type="text" id="inputNama" class="input-element" placeholder="Maks 10 huruf" maxlength="10">
    </div>

    <!-- Tombol Buat Room / Main vs Bot -->
    <div class="input-group">
      <button id="btnMulai" class="btn-main">Mulai Game (Buat Room)</button>
    </div>

    <div class="divider"><span>ATAU GABUNG ROOM</span></div>

    <!-- Input Kode & Gabung -->
    <div class="join-group">
      <input type="text" id="inputKode" class="input-element code-input" placeholder="Kode 4 Digit" maxlength="4">
      <button id="btnGabung" class="btn-join">Gabung</button>
    </div>

    <p id="errorMsg" class="error-msg hidden">Pesan error di sini</p>
  </div>

  <script type="module" src="lobby.js"></script>
</body>
</html>
