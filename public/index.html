<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobby - Kartu Hijaiyyah</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="screen">
  
  <icol class="lobby-card">
    <h1 class="brand-title">Kartu Hijaiyyah</h1>
    <p class="brand-subtitle">Pilih Mode Permainan</p>

    <select id="gameMode" class="input-field">
      <option value="checkmate">Checkmate 101</option>
    </select>

    <input type="text" id="inputNama" class="input-field" placeholder="Nama Kamu (Maks 10 huruf)" maxlength="10">

    <irow class="btn-group mb-15">
      <button id="btnBuat" class="btn-primary btn-full">Buat Room</button>
    </irow>

    <irow class="btn-group">
      <input type="text" id="inputKode" class="input-field code-input" placeholder="Kode 4 Digit" maxlength="4">
      <button id="btnGabung" class="btn-primary btn-gabung">Gabung</button>
    </irow>

    <p id="errorMsg" class="error hidden">Error message</p>
  </icol>

  <script type="module" src="lobby.js"></script>
</body>
</html>
