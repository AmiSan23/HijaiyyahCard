<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkmate 101 - Static</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Panel Informasi Atas -->
  <div class="top-panel">
    <div class="panel-col">
      <div>Room: <span id="roomCode">####</span></div>
      <div>Player:</div>
      <ul id="playerStats">
        <li>Aaa W: 1 L: 2</li>
        <li>Bbb W: 0 L: 1</li>
        <li>Ccc W: 2 L: 2</li>
        <li>Ddd W: 0 L: 2</li>
      </ul>
    </div>
    <div class="panel-col border-left">
      <div>Round: <span id="roundNum">11</span></div>
      <div class="mt-10">Last Game:</div>
      <div>Win: Aaa<br>Lose: Ccc</div>
    </div>
    <div class="panel-col border-left">
      <div>Kartu terbuang: <span id="discardCount">12</span></div>
      <div>Sisa kartu: <span id="deckCount">88</span></div>
      <div class="mt-10">Giliran saat ini:</div>
      <div><ul style="padding-left: 20px; margin: 0;"><li><span id="currentTurnName">Aaa</span></li></ul></div>
    </div>
  </div>

  <!-- Area Meja -->
  <div class="play-area" id="playArea">
    
    <!-- Lawan Atas -->
    <div class="seat seat-top">
      <div class="seat-name" id="nameCcc">Ccc</div>
      <div class="fanning-container opponent-cards" id="handCcc">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- Lawan Kiri -->
    <div class="seat seat-left">
      <div class="seat-name" id="nameDdd">Ddd</div>
      <div class="fanning-container opponent-cards" id="handDdd"></div>
    </div>

    <!-- Lawan Kanan -->
    <div class="seat seat-right">
      <div class="seat-name" id="nameBbb">Bbb</div>
      <div class="fanning-container opponent-cards" id="handBbb"></div>
    </div>

    <!-- Area Tengah (Deck & Discard) -->
    <div class="center-area" id="centerArea">
      <!-- Deck -->
      <div class="pile pile-deck" id="deckPile">
        <img src="img/back.png" class="card-img" alt="Deck">
        <div class="card-overlay-text">Sisa<br><span id="deckSisa">88</span></div>
        <button class="action-btn btn-ambil" id="btnAmbilDeck">Ambil</button>
      </div>

      <!-- Discard Pile (Maks 11 per baris[cite: 4]) -->
      <div class="pile pile-discard">
        <div class="discard-grid" id="discardGrid">
          <!-- Rendered via JS -->
        </div>
        <button class="action-btn btn-ambil" id="btnAmbilDiscard">Ambil</button>
      </div>
    </div>

    <!-- End Game Overlay (Muncul saat selesai[cite: 4]) -->
    <div class="end-game-center hidden" id="endGameCenter">
      <div class="win-text">WIN<br><span id="winnerName">Aaa</span></div>
      <div class="end-actions">
        <button class="btn-primary" id="btnMainLagi">Main Lagi</button>
        <button class="btn-danger" id="btnKeluar">Keluar</button>
      </div>
    </div>

    <!-- Pemain Utama (Bawah) -->
    <div class="seat seat-bottom">
      <div class="fanning-container my-cards" id="myHand">
        <!-- Rendered via JS -->
      </div>
      <div class="seat-name active-turn" id="nameAaa">Aaa</div>
    </div>

    <!-- Panel Poin -->
    <div class="score-panel">
      <div class="score-title">Kartumu:</div>
      <div class="score-detail" id="scoreCards">U' | Khu | Huu | Kh</div>
      <div class="score-calc" id="scoreCalc">26 + 25 + 25 - 25</div>
      <div class="score-title mt-10">Poinmu saat ini:</div>
      <div class="score-total" id="scoreTotal">50</div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
